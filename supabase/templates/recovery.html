<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f8f5ef;color:#2d2925;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:48px 24px;">
      <div style="margin-bottom:32px;font-family:'Songti SC','SimSun',serif;font-size:24px;">焚诀</div>
      <h1 style="margin:0 0 16px;font-family:'Songti SC','SimSun',serif;font-size:28px;font-weight:600;line-height:1.35;">重置账户密码</h1>
      <p style="margin:0 0 28px;color:#6e665f;font-size:15px;line-height:1.8;">通过下面的安全链接设置新密码。链接过期后，需要重新申请。</p>
      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password" style="display:inline-block;background:#9b3b2c;color:#fff;text-decoration:none;padding:12px 20px;border-radius:4px;font-size:15px;">设置新密码</a>
      <p style="margin:32px 0 0;border-top:1px solid #ddd5ca;padding-top:20px;color:#817970;font-size:12px;line-height:1.7;">如果你没有申请重置密码，请忽略这封邮件，原密码不会改变。</p>
    </div>
  </body>
</html>
